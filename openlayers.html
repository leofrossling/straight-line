<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Straight Line Mission - OpenLayers</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@10.5.0/ol.css"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #151515;
        color: #f7f3ea;
      }

      body.dragging-point,
      body.dragging-point #map {
        cursor: grabbing;
      }

      #map {
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: fixed;
        z-index: 10;
        left: 16px;
        bottom: 16px;
        width: min(360px, calc(100vw - 24px));
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(18, 18, 18, 0.88);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(14px);
        padding: 10px 12px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
      }

      .summary {
        margin-top: 3px;
        color: #eee8d7;
        font-size: 12px;
      }

      .gps-summary.good {
        color: #bdf7d4;
      }

      .gps-summary.warn {
        color: #fff0a6;
      }

      .gps-summary.danger {
        color: #ffc4bb;
      }

      .toggle-panel {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        background: #202020;
        color: #fffdf6;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .panel-body {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .panel.collapsed .panel-body {
        display: none;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 12px;
        margin: 0;
        font-size: 13px;
        line-height: 1.35;
      }

      dt {
        color: #d8cda9;
        font-weight: 700;
      }

      dd {
        margin: 0;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: #d8cda9;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        background: #202020;
        color: #fffdf6;
        padding: 8px 10px;
        font: inherit;
      }

      .coord-grid {
        display: grid;
        gap: 8px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr max-content max-content;
        gap: 8px;
        align-items: center;
      }

      .copy-link,
      .gps-button,
      .update-route {
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        padding: 9px 12px;
      }

      .copy-link {
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: #202020;
        color: #fffdf6;
      }

      .gps-button {
        background: #45d483;
        color: #07160d;
      }

      .gps-button.tracking {
        background: #f0b5a8;
        color: #1c0d08;
      }

      .update-route {
        background: #ffdf4d;
        color: #17140a;
      }

      .status {
        min-height: 18px;
        color: #f0b5a8;
        font-size: 12px;
      }

      .gps-status {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.35;
      }

      .gps-status.good {
        border-color: rgba(69, 212, 131, 0.7);
        color: #bdf7d4;
      }

      .gps-status.warn {
        border-color: rgba(255, 223, 77, 0.8);
        color: #fff0a6;
      }

      .gps-status.danger {
        border-color: rgba(240, 111, 88, 0.9);
        color: #ffc4bb;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        font-size: 12px;
        color: #eee8d7;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .sample {
        width: 26px;
        height: 4px;
        border-radius: 999px;
        background: #ffdf4d;
      }

      .sample.buffer {
        height: 14px;
        border: 2px solid #45d483;
        background: rgba(69, 212, 131, 0.26);
      }

      .hint {
        margin: 0;
        color: #eee8d7;
        font-size: 12px;
        line-height: 1.35;
      }

      .ol-attribution {
        font-size: 11px;
      }

      @media (max-width: 520px) {
        .panel {
          left: 12px;
          bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Satellitkarta med straight line mission"></div>
    <aside class="panel collapsed" id="panel" aria-label="Ruttinformation">
      <div class="panel-header">
        <div>
          <h1>Straight line mission</h1>
          <div class="summary">
            <span id="distance-summary">Beräknar...</span> ·
            <span class="gps-summary" id="gps-summary">GPS av</span>
          </div>
        </div>
        <button
          class="toggle-panel"
          id="toggle-panel"
          type="button"
          aria-label="Visa eller dölj ruttpanelen"
          aria-expanded="false"
        >
          +
        </button>
      </div>
      <div class="panel-body">
        <div class="coord-grid">
          <label>
            Startkoordinat
            <input
              id="start-input"
              autocomplete="off"
              inputmode="decimal"
              value="59.115022, 18.234171"
            />
          </label>
          <label>
            Slutkoordinat
            <input
              id="end-input"
              autocomplete="off"
              inputmode="decimal"
              value="59.152230, 17.680517"
            />
          </label>
          <div class="actions">
            <div class="status" id="route-status" aria-live="polite"></div>
            <button class="copy-link" id="copy-link" type="button">
              Länk
            </button>
            <button class="update-route" id="update-route" type="button">
              Uppdatera
            </button>
          </div>
        </div>
        <dl>
          <dt>Start</dt>
          <dd id="start-label">59.115022, 18.234171</dd>
          <dt>Slut</dt>
          <dd id="end-label">59.152230, 17.680517</dd>
          <dt>Distans</dt>
          <dd id="distance">Beräknar...</dd>
          <dt>Silverzon</dt>
          <dd>75 m åt varje håll från linjen</dd>
        </dl>
        <div class="actions">
          <div class="gps-status" id="gps-status" aria-live="polite">
            GPS ej aktiv.
          </div>
          <button class="gps-button" id="gps-button" type="button">
            Starta GPS
          </button>
        </div>
        <label>
          Bildlager
          <select id="basemap">
            <option value="esri">Esri satellit</option>
            <option value="sentinel">Sentinel-2 satellit</option>
            <option value="topo">OpenTopoMap</option>
          </select>
        </label>
        <div class="legend" aria-label="Teckenförklaring">
          <span><i class="sample"></i>Rak linje</span>
          <span><i class="sample buffer"></i>75 m avvikelse</span>
        </div>
        <p class="hint">Dra start- eller slutpunkten på kartan för att ändra linjen.</p>
      </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.5.0/dist/ol.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>
      const initialStart = [18.234171, 59.115022];
      const initialEnd = [17.680517, 59.15223];
      const geoJsonFormat = new ol.format.GeoJSON();

      function parseCoordinate(value) {
        const parts = value
          .trim()
          .split(/[,\s]+/)
          .filter(Boolean)
          .map(Number);

        if (parts.length !== 2 || parts.some((part) => Number.isNaN(part))) {
          throw new Error("Skriv koordinater som lat, lon.");
        }

        const [lat, lon] = parts;

        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
          throw new Error("Koordinaterna är utanför giltigt spann.");
        }

        return [lon, lat];
      }

      function readSharedRoute() {
        const params = new URLSearchParams(window.location.search);
        const startParam = params.get("start-coord") || params.get("start");
        const endParam = params.get("end-coord") || params.get("end");

        try {
          return {
            start: startParam ? parseCoordinate(startParam) : initialStart,
            end: endParam ? parseCoordinate(endParam) : initialEnd,
          };
        } catch {
          return {
            start: initialStart,
            end: initialEnd,
          };
        }
      }

      const sharedRoute = readSharedRoute();
      let currentStart = sharedRoute.start;
      let currentEnd = sharedRoute.end;
      let currentLine = turf.lineString([currentStart, currentEnd]);
      let latestPosition = null;
      let watchId = null;

      const esri = new ol.layer.Tile({
        visible: true,
        source: new ol.source.XYZ({
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          maxZoom: 19,
          crossOrigin: "anonymous",
          attributions:
            "Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community",
        }),
      });

      const sentinel = new ol.layer.Tile({
        visible: false,
        source: new ol.source.XYZ({
          url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/GoogleMapsCompatible/{z}/{y}/{x}.jpg",
          maxZoom: 16,
          crossOrigin: "anonymous",
          attributions:
            'Sentinel-2 cloudless - <a href="https://s2maps.eu/">s2maps.eu</a> by EOX IT Services GmbH',
        }),
      });

      const topo = new ol.layer.Tile({
        visible: false,
        source: new ol.source.XYZ({
          url: "https://{a-c}.tile.opentopomap.org/{z}/{x}/{y}.png",
          maxZoom: 17,
          crossOrigin: "anonymous",
          attributions:
            'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
        }),
      });

      const routeSource = new ol.source.Vector();

      const route = new ol.layer.Vector({
        source: routeSource,
        style: (feature) => {
          const geometryType = feature.getGeometry().getType();

          if (geometryType.includes("Polygon")) {
            return new ol.style.Style({
              stroke: new ol.style.Stroke({
                color: "rgba(69, 212, 131, 0.95)",
                width: 2,
              }),
              fill: new ol.style.Fill({
                color: "rgba(69, 212, 131, 0.22)",
              }),
            });
          }

          return new ol.style.Style({
            stroke: new ol.style.Stroke({
              color: "#ffdf4d",
              width: 4,
            }),
          });
        },
      });

      const points = new ol.layer.Vector({
        source: new ol.source.Vector(),
        style: new ol.style.Style({
          image: new ol.style.Circle({
            radius: 9,
            stroke: new ol.style.Stroke({ color: "#111111", width: 3 }),
            fill: new ol.style.Fill({ color: "#ffdf4d" }),
          }),
        }),
      });

      const locationSource = new ol.source.Vector();
      const locationLayer = new ol.layer.Vector({
        source: locationSource,
        style: (feature) => {
          if (feature.get("kind") === "accuracy") {
            return new ol.style.Style({
              stroke: new ol.style.Stroke({
                color: "rgba(82, 169, 255, 0.8)",
                width: 2,
              }),
              fill: new ol.style.Fill({
                color: "rgba(82, 169, 255, 0.16)",
              }),
            });
          }

          return new ol.style.Style({
            image: new ol.style.Circle({
              radius: 8,
              stroke: new ol.style.Stroke({ color: "#ffffff", width: 3 }),
              fill: new ol.style.Fill({ color: "#52a9ff" }),
            }),
          });
        },
      });

      const map = new ol.Map({
        target: "map",
        layers: [esri, sentinel, topo, route, points, locationLayer],
        view: new ol.View({
          center: ol.proj.fromLonLat([
            (currentStart[0] + currentEnd[0]) / 2,
            (currentStart[1] + currentEnd[1]) / 2,
          ]),
          zoom: 12,
          constrainResolution: true,
        }),
      });

      const pointSource = points.getSource();

      function formatCoordinate(coord) {
        return `${coord[1].toFixed(6)}, ${coord[0].toFixed(6)}`;
      }

      function writeSharedRouteToUrl() {
        const params = new URLSearchParams(window.location.search);
        params.delete("start");
        params.delete("end");
        params.set(
          "start-coord",
          formatCoordinate(currentStart).replace(/\s/g, ""),
        );
        params.set("end-coord", formatCoordinate(currentEnd).replace(/\s/g, ""));
        window.history.replaceState(
          null,
          "",
          `${window.location.pathname}?${params.toString()}${window.location.hash}`,
        );
      }

      function syncCoordinateFields() {
        document.getElementById("start-input").value =
          formatCoordinate(currentStart);
        document.getElementById("end-input").value = formatCoordinate(currentEnd);
      }

      function buildRouteFeatures(start, end) {
        const line = turf.lineString([start, end]);
        const buffer = turf.buffer(line, 75, { units: "meters", steps: 48 });

        return {
          line,
          features: geoJsonFormat.readFeatures(
            turf.featureCollection([buffer, line]),
            {
              dataProjection: "EPSG:4326",
              featureProjection: "EPSG:3857",
            },
          ),
        };
      }

      function updateRoute(start, end, shouldFit = true, shouldShare = true) {
        const { line, features } = buildRouteFeatures(start, end);
        const distanceKm = turf.length(line, { units: "kilometers" });

        currentStart = start;
        currentEnd = end;
        currentLine = line;
        routeSource.clear();
        routeSource.addFeatures(features);

        pointSource.clear();
        pointSource.addFeatures([
          new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat(start)),
            handle: "start",
          }),
          new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat(end)),
            handle: "end",
          }),
        ]);

        syncCoordinateFields();
        document.getElementById("start-label").textContent =
          formatCoordinate(start);
        document.getElementById("end-label").textContent = formatCoordinate(end);
        document.getElementById("distance").textContent =
          `${distanceKm.toFixed(2)} km`;
        document.getElementById("distance-summary").textContent =
          `${distanceKm.toFixed(2)} km`;

        if (shouldFit) {
          map.getView().fit(routeSource.getExtent(), {
            padding: [64, 32, 150, 32],
            maxZoom: 12,
            duration: 250,
          });
        }

        if (shouldShare) {
          writeSharedRouteToUrl();
        }

        updateOfflineWarning();
      }

      function updateLocationFeature(position) {
        const coord = [position.coords.longitude, position.coords.latitude];
        const projected = ol.proj.fromLonLat(coord);

        latestPosition = {
          coord,
          accuracy: position.coords.accuracy,
        };

        locationSource.clear();
        locationSource.addFeatures([
          new ol.Feature({
            geometry: new ol.geom.Circle(projected, position.coords.accuracy),
            kind: "accuracy",
          }),
          new ol.Feature({
            geometry: new ol.geom.Point(projected),
            kind: "position",
          }),
        ]);

        updateOfflineWarning();
      }

      function updateOfflineWarning() {
        const gpsStatus = document.getElementById("gps-status");
        const gpsSummary = document.getElementById("gps-summary");

        if (!latestPosition) {
          return;
        }

        const distanceM = turf.pointToLineDistance(
          turf.point(latestPosition.coord),
          currentLine,
          { units: "meters" },
        );
        const accuracyText = Number.isFinite(latestPosition.accuracy)
          ? ` · noggrannhet ±${Math.round(latestPosition.accuracy)} m`
          : "";

        gpsStatus.classList.remove("good", "warn", "danger");
        gpsSummary.classList.remove("good", "warn", "danger");

        if (distanceM <= 60) {
          gpsStatus.classList.add("good");
          gpsSummary.classList.add("good");
          gpsStatus.textContent = `${Math.round(distanceM)} m från linjen${accuracyText}`;
          gpsSummary.textContent = `${Math.round(distanceM)} m från linjen`;
        } else if (distanceM <= 75) {
          gpsStatus.classList.add("warn");
          gpsSummary.classList.add("warn");
          gpsStatus.textContent = `${Math.round(distanceM)} m från linjen · nära silvergränsen${accuracyText}`;
          gpsSummary.textContent = `${Math.round(distanceM)} m nära gränsen`;
        } else {
          gpsStatus.classList.add("danger");
          gpsSummary.classList.add("danger");
          gpsStatus.textContent = `${Math.round(distanceM)} m från linjen · utanför 75 m${accuracyText}`;
          gpsSummary.textContent = `${Math.round(distanceM)} m utanför`;
        }
      }

      function startGps() {
        const gpsStatus = document.getElementById("gps-status");
        const gpsButton = document.getElementById("gps-button");
        const gpsSummary = document.getElementById("gps-summary");

        if (!("geolocation" in navigator)) {
          gpsStatus.textContent = "GPS stöds inte i den här webbläsaren.";
          gpsStatus.classList.add("danger");
          gpsSummary.classList.add("danger");
          gpsSummary.textContent = "GPS stöds ej";
          return;
        }

        gpsStatus.classList.remove("good", "warn", "danger");
        gpsSummary.classList.remove("good", "warn", "danger");
        gpsStatus.textContent = "Väntar på GPS...";
        gpsSummary.textContent = "väntar på GPS";
        gpsButton.textContent = "Stoppa GPS";
        gpsButton.classList.add("tracking");

        watchId = navigator.geolocation.watchPosition(
          updateLocationFeature,
          (error) => {
            gpsStatus.classList.remove("good", "warn");
            gpsSummary.classList.remove("good", "warn");
            gpsStatus.classList.add("danger");
            gpsSummary.classList.add("danger");
            gpsStatus.textContent =
              error.code === error.PERMISSION_DENIED
                ? "GPS nekades. Tillåt platsåtkomst i webbläsaren."
                : "Kunde inte hämta GPS-position.";
            gpsSummary.textContent =
              error.code === error.PERMISSION_DENIED ? "GPS nekad" : "GPS fel";
            gpsButton.textContent = "Starta GPS";
            gpsButton.classList.remove("tracking");

            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
              watchId = null;
            }
          },
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 12000,
          },
        );
      }

      function stopGps() {
        const gpsStatus = document.getElementById("gps-status");
        const gpsButton = document.getElementById("gps-button");
        const gpsSummary = document.getElementById("gps-summary");

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }

        latestPosition = null;
        locationSource.clear();
        gpsStatus.classList.remove("good", "warn", "danger");
        gpsSummary.classList.remove("good", "warn", "danger");
        gpsStatus.textContent = "GPS ej aktiv.";
        gpsSummary.textContent = "GPS av";
        gpsButton.textContent = "Starta GPS";
        gpsButton.classList.remove("tracking");
      }

      updateRoute(currentStart, currentEnd);

      let draggedFeature = null;

      map.on("pointermove", (event) => {
        const hit = map.hasFeatureAtPixel(event.pixel, {
          layerFilter: (layer) => layer === points,
        });

        map.getTargetElement().style.cursor = hit ? "grab" : "";
      });

      map.addInteraction(
        new ol.interaction.Pointer({
          handleDownEvent: (event) => {
            draggedFeature = map.forEachFeatureAtPixel(
              event.pixel,
              (feature, layer) => (layer === points ? feature : null),
            );

            if (!draggedFeature) {
              return false;
            }

            document.body.classList.add("dragging-point");
            return true;
          },
          handleDragEvent: (event) => {
            if (!draggedFeature) {
              return;
            }

            const lonLat = ol.proj.toLonLat(event.coordinate);
            const handle = draggedFeature.get("handle");

            if (handle === "start") {
              updateRoute(lonLat, currentEnd, false, false);
            } else {
              updateRoute(currentStart, lonLat, false, false);
            }
          },
          handleUpEvent: () => {
            if (!draggedFeature) {
              return false;
            }

            draggedFeature = null;
            document.body.classList.remove("dragging-point");
            writeSharedRouteToUrl();
            return false;
          },
        }),
      );

      document.getElementById("basemap").addEventListener("change", (event) => {
        const selected = event.target.value;
        esri.setVisible(selected === "esri");
        sentinel.setVisible(selected === "sentinel");
        topo.setVisible(selected === "topo");
      });

      document.getElementById("toggle-panel").addEventListener("click", () => {
        const panel = document.getElementById("panel");
        const isCollapsed = panel.classList.toggle("collapsed");
        const button = document.getElementById("toggle-panel");

        button.textContent = isCollapsed ? "+" : "−";
        button.setAttribute("aria-expanded", String(!isCollapsed));
      });

      document.getElementById("update-route").addEventListener("click", () => {
        const status = document.getElementById("route-status");

        try {
          currentStart = parseCoordinate(
            document.getElementById("start-input").value,
          );
          currentEnd = parseCoordinate(
            document.getElementById("end-input").value,
          );
          updateRoute(currentStart, currentEnd);
          status.textContent = "";
        } catch (error) {
          status.textContent = error.message;
        }
      });

      document.getElementById("copy-link").addEventListener("click", async () => {
        const status = document.getElementById("route-status");

        writeSharedRouteToUrl();

        try {
          await navigator.clipboard.writeText(window.location.href);
          status.textContent = "Länk kopierad.";
        } catch {
          status.textContent = "Länken finns i adressfältet.";
        }
      });

      document.getElementById("gps-button").addEventListener("click", () => {
        if (watchId === null) {
          startGps();
        } else {
          stopGps();
        }
      });
    </script>
  </body>
</html>
